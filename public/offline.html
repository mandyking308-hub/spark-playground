<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Aurelia — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: Canvas; color: CanvasText; }
      main { max-width: 34rem; }
      h1 { font-size: 1.6rem; margin-bottom: 0.75rem; }
      p { line-height: 1.6; }
      a { color: LinkText; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Aurelia can show this data-free offline page, but protected profiles, projects, approvals, messages and safeguarding workflows require a live secure connection.</p>
      <p>Nothing sensitive has been queued to send later. Reconnect, then <a href="/">return to Aurelia</a>.</p>
    </main>
  </body>
</html>
